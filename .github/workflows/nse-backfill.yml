name: nse-backfill

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: First year
        default: "1994"
      to_year:
        description: Last year
        default: "2026"
      max_parallel:
        description: Years fetched at the same time (keep NSE load polite)
        default: "4"

permissions:
  contents: read

jobs:
  years:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.y.outputs.list }}
    steps:
      - id: y
        run: echo "list=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.from_year }}, ${{ inputs.to_year }}+1))))")" >> "$GITHUB_OUTPUT"

  backfill:
    needs: years
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        year: ${{ fromJSON(needs.years.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Backfill ${{ matrix.year }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m t2.data.collect_nse backfill --year ${{ matrix.year }}

  audit:
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Audit for gaps
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m t2.data.collect_nse audit | tee audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-audit
          path: audit.json
