name: neural-stage

# One training job of the neural challenger for one test year (called by the neural workflow). A job stops at
# its time budget and hands a checkpoint to the next one; the last job finishes with the best weights.
on:
  workflow_call:
    inputs:
      year: { type: number, required: true }
      seed: { type: number, default: 0 }
      extra: { type: string, default: "" }
      prev: { type: string, default: "" }
      out: { type: string, required: true }
      final: { type: boolean, default: false }
      steps: { type: string, required: true }
      d_model: { type: string, required: true }
      lookback: { type: string, required: true }
      news_dims: { type: string, required: true }

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - if: inputs.prev != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.prev }}
          path: prev
      - name: Train ${{ inputs.year }} (seed ${{ inputs.seed }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTRA: ${{ inputs.extra }}  # e.g. --dropout 0.3 --weight-decay 0.1 (word-split, never evaluated)
        run: >
          uv run --no-sync python -m t2.models.neural fold --year ${{ inputs.year }}
          --steps ${{ inputs.steps }} --d-model ${{ inputs.d_model }}
          --lookback ${{ inputs.lookback }} --news-dims ${{ inputs.news_dims }}
          --seed ${{ inputs.seed }} $EXTRA --budget-min 300 --out out
          ${{ inputs.prev != '' && '--resume prev' || '' }} ${{ inputs.final && '--final' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.out }}
          path: out
          retention-days: 90
