name: signals

on:
  # Runs as soon as the day's NSE data lands (the server starts nse-daily at 19:45 IST on weekdays, and again at
  # 08:20 if signals are missing). GitHub's own schedule below is only a backup: it has started 8-9 hours late.
  workflow_run:
    workflows: [nse-daily]
    types: [completed]
  schedule:
    - cron: "15 2 * * 1-5"  # 07:45 IST, after the night's NSE and GDELT updates, before the 09:15 open
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: champion
  cancel-in-progress: false

jobs:
  score:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        book: [futures, cash]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Score the champion's universe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m t2.models.champion signals --book ${{ matrix.book }}
