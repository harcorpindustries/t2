name: champion-train

on:
  schedule:
    - cron: "30 16 * * 0"  # Sunday 22:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: champion
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        book: [futures, cash]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Train the champion recipe on the latest data and publish it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m t2.models.champion train --book ${{ matrix.book }}
